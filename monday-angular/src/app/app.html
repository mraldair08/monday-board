<h1>Monday Style Board</h1>

<h2>{{ boards[0].title }}</h2>

<table border="5">
  <thead>
    <tr>
      <th *ngFor="let column of boards[0].columns">
        {{ column.name }}
      </th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let row of boards[0].rows">
      
      <td *ngFor="let column of boards[0].columns">

  <ng-container
    *ngIf="
      editingCell?.rowId === row.id &&
      editingCell?.columnId === column.id;
      else normalCell
    "
  >

    <input
      #cellInput
      [value]="row.cells[column.id]"
      (blur)="saveCell(row, column, cellInput.value)"
      (keyup.enter)="saveCell(row, column, cellInput.value)"
    />

  </ng-container>

  <ng-template #normalCell>

    <span (click)="editCell(row, column)">
      {{ row.cells[column.id] }}
    </span>

  </ng-template>

</td>
    </tr>
  </tbody>
</table>
<button (click)="addRow()">+ Agregar fila</button>
